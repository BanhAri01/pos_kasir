<!DOCTYPE html>

    <style>

        a, button { display: flex; align-items: center; justify-content: center; min-height: 60px; border-radius: 16px; font-weight: 700; font-size: 19px; text-decoration: none; margin-top: 14px; border: 0; width: 100%; cursor: pointer; }
        .primary { background: #1f2937; color: #fff; }
